:root{
  --font: 'Inter Variable','Noto Sans Thai Variable','Leelawadee UI','Segoe UI',system-ui,-apple-system,Tahoma,sans-serif;
  --text:#eef3fb; --text-2:rgba(238,243,251,.70); --text-3:rgba(238,243,251,.44);
  --accent:#ff8a2a; --accent-2:#ffc16b; --accent-soft:rgba(255,138,42,.16); --accent-line:rgba(255,138,42,.55);
  --ok:#5be19a; --ref:#7fb2ff;
  --glass-a:rgba(255,255,255,.115); --glass-b:rgba(255,255,255,.04);
  --stroke:rgba(255,255,255,.16); --stroke-hi:rgba(255,255,255,.34);
  --hi:inset 0 1px 0 rgba(255,255,255,.26), inset 0 -1px 0 rgba(255,255,255,.04);
  --shadow:0 28px 70px rgba(2,6,16,.55), 0 4px 14px rgba(2,6,16,.3);
  --chip:rgba(255,255,255,.08); --chip-hi:rgba(255,255,255,.16);
  --bg-grad:radial-gradient(1300px 760px at 50% 40%, #1f3050 0%, #0e1830 52%, #060a14 100%);
  --vig:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,.42) 100%);
  --blur:24px; --r:22px; --gap:18px; --leftW:304px; --rightW:336px; --topH:62px; --dockH:78px;
}
:root[data-theme="light"]{
  --text:#0d1726; --text-2:rgba(13,23,38,.72); --text-3:rgba(13,23,38,.46);
  --accent:#e8590c; --accent-2:#ff922b; --accent-soft:rgba(232,89,12,.12); --accent-line:rgba(232,89,12,.55);
  --ok:#12a150; --ref:#2563eb;
  --glass-a:rgba(255,255,255,.72); --glass-b:rgba(255,255,255,.42);
  --stroke:rgba(255,255,255,.9); --stroke-hi:#fff;
  --hi:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(120,140,170,.12);
  --shadow:0 24px 60px rgba(60,80,120,.22), 0 3px 10px rgba(60,80,120,.12);
  --chip:rgba(20,40,80,.06); --chip-hi:rgba(20,40,80,.12);
  --bg-grad:radial-gradient(1300px 760px at 50% 40%, #fdfefe 0%, #e8eef7 55%, #d2dcec 100%);
  --vig:radial-gradient(ellipse at 50% 46%, rgba(255,255,255,0) 60%, rgba(120,140,175,.22) 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--text);background:var(--bg-grad);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"ss01" 1;transition:background .5s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.grabbing{cursor:grabbing}
#vignette{position:absolute;inset:0;pointer-events:none;background:var(--vig)}

/* ---------- glass ---------- */
.glass{
  background:linear-gradient(158deg,var(--glass-a),var(--glass-b));
  border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.55);backdrop-filter:blur(var(--blur)) saturate(1.55);
  box-shadow:var(--hi),var(--shadow);
  border-radius:var(--r);
}
.hud{transition:opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1), visibility .45s}
body.hud-off .hud, body.hud-off #labels{opacity:0;visibility:hidden;pointer-events:none}
body.hud-off #left{transform:translateX(-24px)} body.hud-off #right{transform:translateX(24px)} body.hud-off #dock{transform:translateY(24px)}
body.intro-on #left, body.intro-on #right, body.intro-on #dock, body.intro-on .tools{opacity:0;visibility:hidden;pointer-events:none}
body.intro-on #left{transform:translateX(-30px)} body.intro-on #right{transform:translateX(30px)} body.intro-on #dock{transform:translateY(30px)}

/* ---------- top ---------- */
.top{position:absolute;left:var(--gap);right:var(--gap);top:var(--gap);height:var(--topH);display:flex;justify-content:space-between;align-items:stretch;gap:14px;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 20px 0 12px;min-width:0;max-width:520px}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid var(--stroke);box-shadow:var(--hi);flex:none}
.logo svg{width:26px;height:26px}
.brand-txt{min-width:0}
.brand h1{font-size:15px;font-weight:650;letter-spacing:.005em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-tabs{position:absolute;left:50%;transform:translateX(-50%);display:flex;padding:6px;gap:4px;border-radius:999px;height:var(--topH);align-items:center}
.unit-tabs button{height:100%;padding:0 22px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--text-2);transition:all .25s;white-space:nowrap}
.unit-tabs button:hover{color:var(--text);background:var(--chip)}
.unit-tabs button.on{color:#1b0f02;background:linear-gradient(180deg,var(--accent-2),var(--accent));box-shadow:0 6px 20px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.55)}
:root[data-theme="light"] .unit-tabs button.on{color:#fff}
.tools{display:flex;align-items:center;gap:4px;padding:0 10px;border-radius:999px}
.views{display:flex;gap:2px}
.views button{height:34px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:550;color:var(--text-2);transition:all .2s}
.views button:hover{background:var(--chip);color:var(--text)}
.sep{width:1px;height:22px;background:var(--stroke);margin:0 6px}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);transition:all .2s;flex:none}
.ic svg{width:19px;height:19px}
.ic:hover{background:var(--chip-hi);color:var(--text)}
.ic.active{color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.ic.lang span{font-size:12px;font-weight:700;letter-spacing:.04em}

/* ---------- panels ---------- */
.panel{position:absolute;top:calc(var(--gap) + var(--topH) + 14px);max-height:calc(100vh - var(--topH) - var(--dockH) - var(--gap)*2 - 28px);display:flex;flex-direction:column;z-index:4;overflow:hidden}
#left{left:var(--gap);width:var(--leftW)}
#right{right:var(--gap);width:var(--rightW);display:block;overflow-y:auto;padding:6px 6px 14px;scrollbar-width:thin;scrollbar-color:var(--chip-hi) transparent}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px 6px}
.panel-head h2{font-size:15px;font-weight:650}
.panel-head p{font-size:11.5px;color:var(--text-3);margin-top:2px}
.count{font-size:11.5px;font-weight:600;color:var(--text-2);background:var(--chip);border:1px solid var(--stroke);padding:3px 10px;border-radius:999px;white-space:nowrap}
#stepList{list-style:none;padding:4px 10px 8px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--chip-hi) transparent}
#stepList .grp{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:700}
#stepList .grp em{font-style:normal;letter-spacing:.02em;text-transform:none;font-weight:600;padding:2px 9px;border-radius:999px;font-size:10.5px}
em.ref{color:var(--ref);background:color-mix(in srgb,var(--ref) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ref) 40%,transparent)}
em.dwg{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 40%,transparent)}
.stepbtn{width:100%;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;text-align:left;padding:6px 12px 6px 8px;border-radius:18px;border:1px solid transparent;transition:all .3s;margin-bottom:2px}
.stepbtn:hover{background:var(--chip)}
.step.active .stepbtn{background:var(--accent-soft);border-color:var(--accent-line);box-shadow:0 10px 34px var(--accent-soft)}
.ring{position:relative;width:40px;height:40px;display:grid;place-items:center}
.ring svg:not(.chk){position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--chip-hi)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:106.8;stroke-dashoffset:106.8;filter:drop-shadow(0 0 4px var(--accent-soft))}
.ring b{font-size:15px;font-weight:700;transition:opacity .2s}
.ring .chk{position:absolute;width:20px;height:20px;fill:none;stroke:var(--ok);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:all .3s}
.step.done .ring b{opacity:0}.step.done .ring .chk{opacity:1;transform:scale(1)}
.step.done .ring .fg{stroke:var(--ok)}
.txt{display:flex;flex-direction:column;min-width:0}
.txt strong{font-size:13.5px;font-weight:620;line-height:1.3}
.txt small{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.meta .state{font-style:normal;font-size:10.5px;font-weight:650;color:var(--text-3);letter-spacing:.03em}
.step.active .state{color:var(--accent)} .step.done .state{color:var(--ok)}
.meta small{font-size:10.5px;color:var(--text-3)}
.panel-foot{padding:10px 18px 16px;border-top:1px solid var(--stroke)}
.note{font-size:11.5px;color:var(--text-2);line-height:1.5}
.note.dim{color:var(--text-3);font-size:10.5px;margin-top:6px}
.note:empty{display:none}

#right section{padding:14px 14px 4px}
#right h3{font-size:18px;font-weight:680;line-height:1.3;margin:10px 0 6px}
#right h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
#right h4 em{font-style:normal;font-size:10.5px;letter-spacing:.02em;text-transform:none;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--text-2);font-weight:600}
#right h4 em.dwg{color:var(--ok)}
.kicker{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--stroke);letter-spacing:.02em}
.chip.ref{color:var(--ref);background:color-mix(in srgb,var(--ref) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ref) 40%,transparent)}
.chip.dwg{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 40%,transparent)}
.desc{font-size:12.8px;color:var(--text-2);line-height:1.62}
.facts{list-style:none;margin-top:12px;display:grid;gap:6px}
.facts li{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:8px 12px;border-radius:12px;background:var(--chip)}
.facts li span{color:var(--text-3);flex:none}
.facts li b{font-weight:620;text-align:right}
.sheets{margin-top:10px;font-size:11px;color:var(--text-3);padding-left:2px}
.done-card{text-align:center;padding:18px 8px 8px}
.done-card .big{width:54px;height:54px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 40%,transparent)}
.done-card .big svg{width:28px;height:28px}
.done-card h3{margin:0 0 4px}
.done-card p{font-size:12.5px;color:var(--text-2)}
#bom ul{list-style:none;display:grid;gap:5px}
#bom li{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--chip);cursor:pointer;transition:all .2s;border:1px solid transparent}
#bom li:hover{background:var(--accent-soft);border-color:var(--accent-line);transform:translateX(-2px)}
#bom .cnt{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--chip-hi)}
#bom .nm{font-size:12.3px;font-weight:560;line-height:1.35;display:flex;flex-direction:column}
#bom .nm small{font-size:10.5px;color:var(--text-3);font-weight:500}
#bom .sh{font-size:10.5px;color:var(--text-3);white-space:nowrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{padding:10px 12px;border-radius:14px;background:var(--chip);min-width:0}
.tile small{display:block;font-size:10.5px;color:var(--text-3);margin-bottom:2px}
.tile b{font-size:15px;font-weight:680;white-space:nowrap}
.tiles.wide{margin-top:6px}
.tile b.sm{font-size:12.5px;font-weight:650;white-space:normal;line-height:1.3;display:block}
.tile b i{font-style:normal;font-size:10.5px;color:var(--text-3);margin-left:4px;font-weight:600}
#sel{display:none}
#sel.on{display:block}
#sel{margin:6px 6px 0;padding:14px;border-radius:18px;background:var(--accent-soft);border:1px solid var(--accent-line)}
#sel h4{margin:6px 0 8px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--text);font-weight:680}
.sel-top{display:flex;justify-content:space-between;align-items:center}
.sel-top small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sel-top button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--text-2)}
.sel-top button:hover{background:var(--chip-hi)}
.sel-top svg{width:15px;height:15px}

/* ---------- dock ---------- */
#dock{position:absolute;left:var(--gap);right:var(--gap);bottom:var(--gap);height:var(--dockH);display:flex;align-items:center;gap:20px;padding:0 20px 0 14px;z-index:5;border-radius:26px}
.transport{display:flex;align-items:center;gap:4px}
.ic.primary{width:50px;height:50px;color:#1b0f02;background:linear-gradient(180deg,var(--accent-2),var(--accent));box-shadow:0 8px 24px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.55)}
:root[data-theme="light"] .ic.primary{color:#fff}
.ic.primary:hover{filter:brightness(1.08);color:#1b0f02;background:linear-gradient(180deg,var(--accent-2),var(--accent))}
:root[data-theme="light"] .ic.primary:hover{color:#fff}
.ic.primary svg{width:22px;height:22px}
.tl{flex:1;min-width:200px;position:relative;height:56px;margin-top:2px}
.ticks{position:absolute;left:0;right:0;top:0;height:22px}
.tick{position:absolute;transform:translateX(-50%);top:0;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;color:var(--text-3);transition:all .25s;background:transparent}
.tick:hover{color:var(--text);background:var(--chip)}
.tick.on{color:var(--accent)}
.bar{position:absolute;left:0;right:0;bottom:2px;height:28px;cursor:pointer;touch-action:none}
.bar .track{position:absolute;left:0;right:0;top:11px;height:6px;border-radius:99px;background:var(--chip-hi);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.bar .fill{position:absolute;left:0;top:11px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:0 0 14px var(--accent-soft);pointer-events:none}
.bar .segs{position:absolute;left:0;right:0;top:11px;height:6px;pointer-events:none}
.bar .segs i{position:absolute;top:0;height:6px;box-shadow:inset -2px 0 0 var(--bg-sep,rgba(10,16,30,.7))}
:root[data-theme="light"] .bar .segs i{box-shadow:inset -2px 0 0 rgba(235,240,248,.95)}
.bar .knob{position:absolute;top:6px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);background:#fff;box-shadow:0 0 0 4px var(--accent-soft),0 3px 10px rgba(0,0,0,.35);pointer-events:none}
.opts{display:flex;align-items:center;gap:8px}
.pillbtn{height:34px;min-width:52px;padding:0 12px;border-radius:999px;font-weight:700;font-size:12.5px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--stroke);color:var(--text)}
.pillbtn:hover{background:var(--chip-hi)}
.slider{display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;height:38px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--stroke);color:var(--text-2)}
.slider svg{width:18px;height:18px;flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:6px;border-radius:99px;background:var(--chip-hi);outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--accent-soft),0 2px 8px rgba(0,0,0,.35);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--accent-soft),0 2px 8px rgba(0,0,0,.35);cursor:pointer}

#testChips{position:absolute;left:50%;bottom:calc(var(--gap) + var(--dockH) + 16px);transform:translate(-50%,16px);display:flex;gap:10px;opacity:0;visibility:hidden;pointer-events:none;z-index:5}
#testChips.on{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0)}
body.hud-off #testChips{opacity:0;visibility:hidden}
.chipbtn{display:flex;align-items:center;gap:9px;height:46px;padding:0 20px 0 16px;border-radius:999px;font-weight:620;font-size:13px;transition:all .25s}
.chipbtn svg{width:20px;height:20px;color:var(--accent)}
.chipbtn:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.chipbtn.active{background:linear-gradient(158deg,var(--accent-soft),var(--glass-b));border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line),var(--shadow)}

/* ---------- intro ---------- */
#intro{position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);width:min(620px,calc(100vw - 36px));padding:30px 34px 24px;text-align:center;z-index:6;transition:all .6s cubic-bezier(.2,.8,.2,1)}
#intro.gone{opacity:0;visibility:hidden;transform:translate(-50%,24px);pointer-events:none}
#intro .kicker{display:block;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px}
#intro h2{font-size:clamp(22px,2.6vw,30px);font-weight:700;line-height:1.28;margin-bottom:10px}
#intro .body{font-size:13.5px;color:var(--text-2);line-height:1.65;max-width:520px;margin:0 auto 20px}
#intro .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.cta{display:flex;align-items:center;gap:10px;height:50px;padding:0 28px 0 22px;border-radius:999px;font-weight:700;font-size:14.5px;color:#1b0f02;background:linear-gradient(180deg,var(--accent-2),var(--accent));box-shadow:0 12px 34px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.55);transition:all .25s}
:root[data-theme="light"] .cta{color:#fff}
.cta:hover{transform:translateY(-2px);filter:brightness(1.06)}
.cta svg{width:20px;height:20px}
.ghost{height:50px;padding:0 26px;border-radius:999px;font-weight:620;font-size:14px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--stroke);transition:all .25s}
.ghost:hover{background:var(--chip-hi)}
#intro .hint{margin-top:16px;font-size:11px;color:var(--text-3)}

/* ---------- labels / tooltip / toast ---------- */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.lbl{position:absolute;left:0;top:0;opacity:0;transition:opacity .4s;will-change:transform}
.lbl.on{opacity:1}
.lbl .dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.4),0 0 18px var(--accent)}
.lbl .dot::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px solid var(--accent);animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.lbl .lead{position:absolute;overflow:visible}
.lbl line{stroke:var(--accent);stroke-width:1.4;opacity:.8}
.lbl .pill{position:absolute;left:0;top:0;transform:translate(var(--dx),calc(var(--dy) - 50%));padding:7px 14px 8px;border-radius:14px;white-space:nowrap;display:flex;flex-direction:column;
  background:linear-gradient(158deg,var(--glass-a),var(--glass-b));border:1px solid var(--stroke);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);box-shadow:var(--hi),0 12px 30px rgba(2,6,16,.35)}
.lbl .pill.left{transform:translate(calc(var(--dx) - 100%),calc(var(--dy) - 50%))}
.lbl .pill b{font-size:12.5px;font-weight:650}
.lbl .pill em{font-style:normal;font-size:10.5px;color:var(--text-3);margin-top:1px}
#tip{position:fixed;left:0;top:0;padding:9px 14px;border-radius:14px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:9;display:flex;flex-direction:column;max-width:270px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#tip b{font-size:12.8px;font-weight:650}
#tip span{font-size:10.5px;color:var(--text-3)}
#toast{position:absolute;left:50%;top:calc(var(--gap) + var(--topH) + 18px);transform:translate(-50%,-10px);padding:9px 20px;border-radius:999px;font-size:12.5px;font-weight:650;opacity:0;pointer-events:none;transition:all .35s;z-index:8;color:var(--accent)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#showHud{position:absolute;right:var(--gap);bottom:var(--gap);width:46px;height:46px;opacity:0;visibility:hidden;z-index:7;transition:opacity .4s}
body.hud-off #showHud{opacity:.55;visibility:visible}
body.hud-off #showHud:hover{opacity:1}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  :root{--leftW:280px;--rightW:300px}
  .views button{padding:0 9px}
  .brand h1{font-size:14px}
}
@media (max-width:1120px){
  #right{display:none}
  .brand p{display:none}
  .tools .views{display:none}.tools .sep{display:none}
  .opts .slider input{width:70px}
}
@media (max-width:820px){
  #left{display:none}
  .unit-tabs{position:static;transform:none}
  .brand-txt{display:none}
  #dock{gap:10px;padding:0 12px}
  .opts .ic,.opts .slider{display:none}
  .top{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}

</style>
</head>
<body class="intro-on">
<div id="app">

      <button id="speedBtn" class="pillbtn" data-i18n-title="speed">1×</button>
      <label class="slider" data-i18n-title="explode"><span data-icon="explode"></span><input id="explode" type="range" min="0" max="100" value="0" aria-label="explode"></label>
      <button id="focusBtn" class="ic" data-icon="focus" data-i18n-title="focus"></button>

  <!-- intro -->
  <section id="intro" class="glass">
    <p class="kicker" data-i18n="intro_kicker"></p>
